<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Desk Stats board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=Roboto+Slab:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff; --ink: #212721; --muted: #494949; --gray: #bbbcbc;
    --green: #006633; --green-dark: #00492a; --green-wash: rgba(0, 102, 51, .10);
    --yellow: #ffe100; --yellow-wash: rgba(255, 225, 0, .30);
    --err: #c22f1f; --err-wash: rgba(194, 47, 31, .10);
    --sans: "Raleway", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --slab: "Roboto Slab", Rockwell, Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --shadow-sm: 3px 3px 0 var(--ink); --shadow: 4px 4px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button { font-family: var(--sans); color: var(--ink); border-radius: 0; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .masthead { border-top: 8px solid var(--yellow); border-bottom: 10px solid var(--ink); padding: 12px 16px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .wordmark { font-family: var(--slab); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; line-height: 1; margin: 0; }
  .kicker { font-family: var(--mono); font-weight: 700; font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .btn { border: 3px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px; box-shadow: var(--shadow-sm); transition: transform .05s, box-shadow .05s; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: var(--shadow); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.on { background: var(--green); color: #fff; }
  .btn:disabled { background: var(--gray); box-shadow: none; transform: none; cursor: not-allowed; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .banner { border: 3px solid var(--err); border-left-width: 10px; background: var(--err-wash); padding: 12px 14px; margin: 16px; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tile { border: 3px solid var(--ink); box-shadow: var(--shadow); padding: 12px 14px; }
  .tile .name { font-weight: 800; font-size: 15px; }
  .tile .nums { display: flex; gap: 18px; margin-top: 8px; }
  .tile .num { font-family: var(--mono); font-size: 34px; line-height: 1; }
  .tile .lbl { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .board { margin-bottom: 30px; }
  .board h2 { font-family: var(--slab); font-size: 20px; margin: 0 0 8px; border-bottom: 6px solid var(--ink); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .board h2 .kicker { margin: 0; }
  .scroll { overflow-x: auto; border: 3px solid var(--ink); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; min-width: 760px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--ink); padding: 6px 10px; text-align: right; font-family: var(--mono); font-size: 13px; }
  th { background: var(--ink); color: #fff; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; border-bottom: 3px solid var(--ink); white-space: nowrap; }
  th.today, td.today { background: var(--yellow-wash); }
  th.today { background: var(--green); }
  td.label, th.label { text-align: left; font-family: var(--sans); font-weight: 700; }
  td.mode { text-align: left; font-family: var(--sans); color: var(--muted); }
  tr.total td { font-weight: 800; border-top: 3px solid var(--ink); background: var(--green-wash); }
  tr.gap td { border: 0; height: 10px; background: var(--paper); }
  td.zero { color: var(--gray); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media print { .controls, .foot { display: none; } .scroll { box-shadow: none; } }
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1 class="wordmark">Desk Stats board</h1>
    <div class="kicker">Motlow State Community College Libraries</div>
  </div>
  <div class="controls" id="controls">
    <button class="btn" type="button" id="refreshBtn">Refresh now</button>
    <span class="kicker" id="updated">Loading</span>
  </div>
</header>
<div id="banner" class="banner" hidden role="alert"></div>
<script>
  /* If anything below breaks, say so in the red box instead of showing a blank page. */
  window.addEventListener('error', function (ev) {
    var box = document.getElementById('banner');
    if (!box) return;
    var msg = 'The board hit a problem and stopped: ' + (ev.message || 'unknown error') + (ev.lineno ? ' (line ' + ev.lineno + ')' : '') + '.';
    var scripts = document.querySelectorAll('script');
    var main = scripts[scripts.length - 1];
    if (main && main.textContent.indexOf('<' + '?!=') >= 0) {
      msg += ' Google did not fill in the settings line, which means this page was not served by the doGet function in Code.gs.';
    }
    box.textContent = msg;
    box.hidden = false;
  });
</script>
<main class="wrap">
  <div class="controls" id="campusPicker" style="margin-bottom:16px"></div>
  <div class="tiles" id="tiles"></div>
  <div id="boards"></div>
  <div class="foot">The grid is this week's paper sheet, filled in live: Sunday to Saturday, In person and Remote per category, the in-person total, and the gate count per time block. It refreshes itself every minute.</div>
</main>
<script>
var CONFIG = <?!= configJson ?>;
(function () {
  'use strict';
  var state = { campus: 'all', data: null, busy: false };
  function el(id) { return document.getElementById(id); }
  function showBanner(t) { el('banner').textContent = t; el('banner').hidden = false; }
  function hideBanner() { el('banner').hidden = true; }
  function pretty(key) {
    var p = key.split('-');
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return months[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10);
  }
  function timeNow() { var d = new Date(); return (d.getHours() % 12 || 12) + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + (d.getHours() < 12 ? ' am' : ' pm'); }

  function renderPicker() {
    var box = el('campusPicker');
    box.innerHTML = '';
    var names = ['all'].concat((CONFIG.campuses || []).map(function (c) { return c.name; }));
    names.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (state.campus === n ? ' on' : '');
      b.textContent = n === 'all' ? 'All campuses' : n;
      b.setAttribute('aria-pressed', state.campus === n ? 'true' : 'false');
      b.addEventListener('click', function () { state.campus = n; renderPicker(); render(); });
      box.appendChild(b);
    });
  }

  function cell(value, isToday, extraClass) {
    var td = document.createElement('td');
    td.textContent = String(value);
    td.className = (isToday ? 'today ' : '') + (value === 0 ? 'zero ' : '') + (extraClass || '');
    return td;
  }

  function renderBoard(b, days, today, categories, modes) {
    var box = document.createElement('section');
    box.className = 'board';
    var h = document.createElement('h2');
    h.textContent = b.campus;
    var k = document.createElement('span');
    k.className = 'kicker';
    k.textContent = 'Week of ' + pretty(days[0]) + ' to ' + pretty(days[6]);
    h.appendChild(k);
    box.appendChild(h);
    var scroll = document.createElement('div');
    scroll.className = 'scroll';
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var hr = document.createElement('tr');
    ['Category', 'Mode'].forEach(function (t) { var th = document.createElement('th'); th.className = 'label'; th.textContent = t; hr.appendChild(th); });
    var dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    days.forEach(function (d, i) { var th = document.createElement('th'); th.textContent = dayNames[i] + ' ' + pretty(d); if (d === today) th.className = 'today'; hr.appendChild(th); });
    var tt = document.createElement('th'); tt.textContent = 'Total'; hr.appendChild(tt);
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = document.createElement('tbody');
    var addRow = function (label, mode, values, cls) {
      var tr = document.createElement('tr');
      if (cls) tr.className = cls;
      var l = document.createElement('td'); l.className = 'label'; l.textContent = label; tr.appendChild(l);
      var m = document.createElement('td'); m.className = 'mode'; m.textContent = mode; tr.appendChild(m);
      var sum = 0;
      values.forEach(function (v, i) { sum += v; tr.appendChild(cell(v, days[i] === today)); });
      tr.appendChild(cell(sum, false));
      tbody.appendChild(tr);
    };
    categories.forEach(function (c) {
      modes.forEach(function (m) { addRow(c, m, b.cells[c + '|' + m] || [0, 0, 0, 0, 0, 0, 0]); });
    });
    addRow('TOTAL (In person questions only)', '', b.inPerson, 'total');
    addRow('TOTAL (all questions)', '', b.all, 'total');
    var gap = document.createElement('tr'); gap.className = 'gap'; gap.innerHTML = '<td colspan="10"></td>'; tbody.appendChild(gap);
    b.blocks.forEach(function (blk) { addRow('Gate Count', blk, b.gate[blk] || [0, 0, 0, 0, 0, 0, 0]); });
    addRow('Gate Count', 'GC Total', b.gateTotals, 'total');
    table.appendChild(tbody);
    scroll.appendChild(table);
    box.appendChild(scroll);
    return box;
  }

  function render() {
    var d = state.data;
    if (!d) return;
    var boards = d.boards.filter(function (b) { return state.campus === 'all' || b.campus === state.campus; });
    var tiles = el('tiles');
    tiles.innerHTML = '';
    boards.forEach(function (b) {
      var t = document.createElement('div');
      t.className = 'tile';
      t.innerHTML = '<div class="name"></div><div class="nums"><div><div class="num"></div><div class="lbl">questions today</div></div><div><div class="num"></div><div class="lbl">gate today</div></div></div>';
      t.querySelector('.name').textContent = b.campus;
      t.querySelectorAll('.num')[0].textContent = String(b.todayTaps);
      t.querySelectorAll('.num')[1].textContent = String(b.todayGate || 0);
      tiles.appendChild(t);
    });
    var box = el('boards');
    box.innerHTML = '';
    boards.forEach(function (b) { box.appendChild(renderBoard(b, d.days, d.today, d.categories, d.modes)); });
  }

  function refresh() {
    if (state.busy || CONFIG.error) return;
    state.busy = true;
    el('refreshBtn').disabled = true;
    el('refreshBtn').title = 'Refreshing now';
    google.script.run
      .withSuccessHandler(function (res) {
        state.data = res;
        state.busy = false;
        el('refreshBtn').disabled = false;
        el('refreshBtn').title = '';
        el('updated').textContent = 'Updated ' + timeNow();
        hideBanner();
        render();
      })
      .withFailureHandler(function (err) {
        state.busy = false;
        el('refreshBtn').disabled = false;
        el('refreshBtn').title = '';
        el('updated').textContent = 'Could not refresh';
        showBanner('The board could not read the sheet: ' + String(err && err.message ? err.message : err) + '. It will try again in a minute.');
      })
      .getBoard(state.campus === 'all' ? 'all' : state.campus);
  }

  if (CONFIG.error) {
    showBanner('The board cannot start: ' + CONFIG.error);
    el('refreshBtn').disabled = true;
    el('refreshBtn').title = 'Fix the problem in the red box first';
  }
  renderPicker();
  el('refreshBtn').addEventListener('click', refresh);
  refresh();
  setInterval(refresh, 60 * 1000);
})();
</script>
</body>
</html>
